    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/chat/heart/url/info', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(function(response) {
                    return response.json();
                })
                .then(function(res) {
                    if (res.code === 1 && res.data) {
                        var data = res.data;
                        
                        function getUrl(url) {
                             if (!url) return '';
                             return (url.indexOf('http') === 0) ? url : 'https://' + url;
                        }

                        // Update Main Site
                        var mainLink = document.getElementById('main-site-link');
                        if (data.mainSiteUrl) {
                            mainLink.href = getUrl(data.mainSiteUrl);
                            mainLink.textContent = data.mainSiteUrl;
                        } else {
                             mainLink.textContent = '暂无';
                             mainLink.removeAttribute('href');
                        }

                        // Update Backup 1
                        var backup1 = document.getElementById('backup-1-link');
                        if (data.backup1Url) {
                            backup1.href = getUrl(data.backup1Url);
                            backup1.textContent = data.backup1Url;
                        } else {
                            backup1.parentElement.style.display = 'none';
                        }

                        // Update Backup 2
                        var backup2 = document.getElementById('backup-2-link');
                        if (data.backup2Url) {
                            backup2.href = getUrl(data.backup2Url);
                            backup2.textContent = data.backup2Url;
                        } else {
                            backup2.parentElement.style.display = 'none';
                        }

                        // Update Email
                        var emailSpan = document.getElementById('official-email');
                        if (data.officialEmail) {
                            emailSpan.textContent = data.officialEmail;
                        }
                    }
                })
                .catch(function(error) {
                    console.error('Failed to fetch info:', error);
                });
        });
    </script>
