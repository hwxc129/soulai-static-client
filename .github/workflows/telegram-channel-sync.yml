name: Archive Telegram channel posts

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-channel-sync-main
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive safe channel text posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN is not configured; no channel content was read or published."
            exit 0
          fi
          python3 tools/telegram_channel_to_github.py \
            --channel-id -1002621410281 \
            --notify-chat-id 7244416496 \
            --repo "$GITHUB_REPOSITORY" \
            --github-state-path "telegram-posts/.sync-state.json" \
            --once
